<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🕵️ Thám tử danh từ - Lớp 4</title>

<style>

/* =========================
   GIAO DIỆN CHUNG
========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    color:#263238;
}

.container{
    width:95%;
    max-width:850px;
    margin:20px auto;
    background:white;
    border-radius:28px;
    padding:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
}

/* =========================
   TIÊU ĐỀ
========================= */

.header{
    text-align:center;
}

.logo{
    font-size:60px;
    animation:bounce 2s infinite;
}

h1{
    margin:0;
    font-size:34px;
    color:#e65100;
    text-shadow:2px 2px 0 #ffe0b2;
}

.subtitle{
    margin:8px 0 15px;
    font-size:18px;
    font-weight:bold;
    color:#455a64;
}

.remember{
    background:#fff8e1;
    border:2px dashed #ffb300;
    border-radius:18px;
    padding:13px;
    margin:15px 0;
    font-size:17px;
    line-height:1.5;
}

/* =========================
   THÔNG TIN TRÒ CHƠI
========================= */

.info{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin:15px 0;
}

.info-box{
    flex:1;
    background:#e3f2fd;
    border-radius:15px;
    padding:10px;
    text-align:center;
    font-weight:bold;
    color:#1565c0;
}

/* =========================
   THANH TIẾN TRÌNH
========================= */

.progress-bg{
    width:100%;
    height:18px;
    background:#e0e0e0;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00c853,#64dd17);
    transition:0.5s;
}

/* =========================
   CÂU HỎI
========================= */

.question-box{
    background:linear-gradient(135deg,#e8f5e9,#f1f8e9);
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    border-left:7px solid #43a047;
}

.question{
    font-size:23px;
    font-weight:bold;
    line-height:1.5;
    color:#1b5e20;
}

/* =========================
   ĐÁP ÁN
========================= */

.option{
    background:#f5f9ff;
    border:3px solid #e3f2fd;
    border-radius:17px;
    padding:15px;
    margin:12px 0;
    font-size:18px;
    cursor:pointer;
    transition:0.25s;
}

.option:hover{
    background:#e1f5fe;
    border-color:#29b6f6;
    transform:translateX(5px);
}

.option.correct{
    background:#c8e6c9 !important;
    border-color:#2e7d32 !important;
    color:#1b5e20;
    font-weight:bold;
    animation:correctPop 0.5s;
}

.option.wrong{
    background:#ffcdd2 !important;
    border-color:#c62828 !important;
    color:#b71c1c;
    animation:shake 0.4s;
}

/* =========================
   THÔNG BÁO
========================= */

.message{
    min-height:45px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin:10px 0;
}

.message.correct-message{
    color:#2e7d32;
}

.message.wrong-message{
    color:#c62828;
}

/* =========================
   NÚT
========================= */

.btn{
    width:100%;
    border:none;
    border-radius:17px;
    padding:15px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#ff9800,#f57c00);
    box-shadow:0 5px 12px rgba(0,0,0,0.18);
    transition:0.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn:active{
    transform:scale(0.98);
}

/* =========================
   MÀN HÌNH KẾT QUẢ
========================= */

#result{
    display:none;
    text-align:center;
}

.result-title{
    font-size:32px;
    color:#e65100;
    margin-bottom:15px;
}

.score-circle{
    width:190px;
    height:190px;
    margin:20px auto;
    border-radius:50%;
    background:linear-gradient(135deg,#ffca28,#ff9800);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    box-shadow:0 0 30px rgba(255,152,0,0.6);
    animation:zoomIn 0.8s;
}

.score-number{
    font-size:52px;
    font-weight:bold;
}

.score-label{
    font-size:18px;
}

.rank{
    font-size:28px;
    font-weight:bold;
    color:#6a1b9a;
    margin:15px;
}

.stars{
    font-size:38px;
    letter-spacing:5px;
}

.comment{
    background:#f3e5f5;
    padding:15px;
    border-radius:17px;
    font-size:18px;
    line-height:1.5;
    margin:15px 0;
}

/* =========================
   PHÁO HOA
========================= */

#confetti{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:9999;
    overflow:hidden;
}

.confetti{
    position:absolute;
    width:10px;
    height:16px;
    top:-20px;
    animation:fall 4s linear forwards;
}

/* =========================
   ANIMATION
========================= */

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

@keyframes correctPop{
    0%{
        transform:scale(0.9);
    }
    50%{
        transform:scale(1.04);
    }
    100%{
        transform:scale(1);
    }
}

@keyframes shake{
    0%,100%{
        transform:translateX(0);
    }
    25%{
        transform:translateX(-8px);
    }
    50%{
        transform:translateX(8px);
    }
    75%{
        transform:translateX(-5px);
    }
}

@keyframes zoomIn{
    from{
        transform:scale(0);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes fall{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }
    100%{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

/* =========================
   ĐIỆN THOẠI
========================= */

@media(max-width:600px){

    .container{
        width:96%;
        margin:8px auto;
        padding:15px;
        border-radius:20px;
    }

    .logo{
        font-size:48px;
    }

    h1{
        font-size:27px;
    }

    .subtitle{
        font-size:16px;
    }

    .question{
        font-size:20px;
    }

    .option{
        font-size:17px;
        padding:13px;
    }

    .info-box{
        font-size:15px;
    }

    .result-title{
        font-size:27px;
    }

}

</style>
</head>


<body>

<!-- =========================
     PHÁO HOA
========================= -->

<div id="confetti"></div>


<div class="container">

<!-- =========================
     PHẦN TIÊU ĐỀ
========================= -->

<div class="header">

    <div class="logo">🕵️‍♂️</div>

    <h1>THÁM TỬ DANH TỪ</h1>

    <div class="subtitle">
        🔎 Nhiệm vụ: Tìm những từ chỉ sự vật!
    </div>

</div>


<!-- =========================
     KIẾN THỨC GHI NHỚ
========================= -->

<div class="remember">

    💡 <b>THÁM TỬ GHI NHỚ:</b><br>

    Danh từ là những từ chỉ <b>sự vật</b>, như:
    <br>

    👤 <b>Người</b> &nbsp; 🐶 <b>Con vật</b> &nbsp;
    🎒 <b>Đồ vật</b> &nbsp; 🌳 <b>Cây cối</b>
    <br>

    ⏰ <b>Thời gian</b> &nbsp; 🌧️ <b>Hiện tượng tự nhiên</b>

</div>


<!-- =========================
     THÔNG TIN
========================= -->

<div class="info">

    <div class="info-box" id="questionNumber">
        Câu 1/20
    </div>

    <div class="info-box" id="score">
        Điểm: 0
    </div>

</div>


<!-- =========================
     THANH TIẾN TRÌNH
========================= -->

<div class="progress-bg">

    <div class="progress" id="progress"></div>

</div>


<!-- =========================
     PHẦN CÂU HỎI
========================= -->

<div id="quiz">

    <div class="question-box">

        <div class="question" id="question">
        </div>

    </div>


    <div id="options">
    </div>


    <div class="message" id="message">
    </div>


    <button
        class="btn"
        id="nextButton"
        onclick="nextQuestion()"
        style="display:none;">

        ➡️ Câu tiếp theo

    </button>

</div>


<!-- =========================
     KẾT QUẢ
========================= -->

<div id="result">

    <div class="result-title">
        🎉 HOÀN THÀNH NHIỆM VỤ!
    </div>

    <div class="score-circle">

        <div class="score-number" id="finalScore">
            0
        </div>

        <div class="score-label">
            điểm / 10
        </div>

    </div>


    <div class="rank" id="rank">
    </div>


    <div class="stars" id="stars">
    </div>


    <div class="comment" id="comment">
    </div>


    <button
        class="btn"
        onclick="restartGame()">

        🔄 CHƠI LẠI

    </button>

</div>


</div>


<script>

/* ==================================================
   DỮ LIỆU 20 CÂU HỎI
   CHỈ TẬP TRUNG VÀO KHÁI NIỆM DANH TỪ
================================================== */

const questions = [

{
    q:"1. Danh từ là gì?",
    o:[
        "Từ chỉ hoạt động, trạng thái",
        "Từ chỉ sự vật",
        "Từ chỉ đặc điểm",
        "Từ chỉ tính chất"
    ],
    a:1
},

{
    q:"2. Từ nào dưới đây là danh từ?",
    o:[
        "chạy",
        "đẹp",
        "bàn",
        "nhanh"
    ],
    a:2
},

{
    q:"3. Từ nào chỉ người?",
    o:[
        "cô giáo",
        "cây bàng",
        "quyển sách",
        "con mèo"
    ],
    a:0
},

{
    q:"4. Từ nào chỉ con vật?",
    o:[
        "chiếc bàn",
        "con chó",
        "bông hoa",
        "ngôi nhà"
    ],
    a:1
},

{
    q:"5. Từ nào chỉ đồ vật?",
    o:[
        "con gà",
        "cây xoài",
        "cái cặp",
        "bầu trời"
    ],
    a:2
},

{
    q:"6. Từ nào chỉ cây cối?",
    o:[
        "cây phượng",
        "con trâu",
        "cái bút",
        "cô giáo"
    ],
    a:0
},

{
    q:"7. Từ nào chỉ thời gian?",
    o:[
        "buổi sáng",
        "con chim",
        "chiếc xe",
        "cây tre"
    ],
    a:0
},

{
    q:"8. Từ nào chỉ hiện tượng tự nhiên?",
    o:[
        "mưa",
        "bàn học",
        "học sinh",
        "quyển vở"
    ],
    a:0
},

{
    q:"9. Dòng nào dưới đây gồm toàn danh từ?",
    o:[
        "cây, bàn, sách",
        "chạy, nhảy, đi",
        "đẹp, cao, xanh",
        "vui, buồn, nhanh"
    ],
    a:0
},

{
    q:"10. Từ nào KHÔNG phải là danh từ?",
    o:[
        "con mèo",
        "bông hoa",
        "chạy",
        "ngôi nhà"
    ],
    a:2
},

{
    q:"11. Trong câu: “Lan cầm quyển sách.” Có những danh từ nào?",
    o:[
        "Lan, cầm",
        "cầm, sách",
        "Lan, quyển sách",
        "quyển, cầm"
    ],
    a:2
},

{
    q:"12. Trong câu: “Con mèo nằm bên chiếc ghế.” Có mấy danh từ?",
    o:[
        "1 danh từ",
        "2 danh từ",
        "3 danh từ",
        "4 danh từ"
    ],
    a:2
},

{
    q:"13. Từ nào dưới đây chỉ sự vật là người?",
    o:[
        "học sinh",
        "cái bàn",
        "con cá",
        "cây cam"
    ],
    a:0
},

{
    q:"14. Từ nào dưới đây chỉ sự vật là đồ vật?",
    o:[
        "bác sĩ",
        "chiếc cặp",
        "con voi",
        "cây bưởi"
    ],
    a:1
},

{
    q:"15. Từ nào dưới đây chỉ sự vật là con vật?",
    o:[
        "con thỏ",
        "cái ghế",
        "cây dừa",
        "cô giáo"
    ],
    a:0
},

{
    q:"16. Từ nào dưới đây chỉ sự vật là cây cối?",
    o:[
        "quả bóng",
        "con chim",
        "cây xoài",
        "người bạn"
    ],
    a:2
},

{
    q:"17. Từ nào dưới đây chỉ thời gian?",
    o:[
        "buổi tối",
        "chiếc đồng hồ",
        "con mèo",
        "cây cau"
    ],
    a:0
},

{
    q:"18. Từ nào dưới đây chỉ hiện tượng tự nhiên?",
    o:[
        "mưa",
        "cái ô",
        "em bé",
        "cây xanh"
    ],
    a:0
},

{
    q:"19. Trong câu: “Buổi sáng, chim hót trên cây.” Có những danh từ nào?",
    o:[
        "buổi sáng, chim, cây",
        "hót, trên",
        "buổi, hót, cây",
        "chim, hót"
    ],
    a:0
},

{
    q:"20. Nhóm từ nào gồm các danh từ chỉ sự vật?",
    o:[
        "cô giáo, con mèo, cây bàng, quyển vở",
        "chạy, con mèo, đẹp, cây bàng",
        "nhanh, vui, quyển vở, học",
        "đỏ, xanh, cao, thấp"
    ],
    a:0
}

];


/* ==================================================
   BIẾN TRÒ CHƠI
================================================== */

let currentQuestion = 0;

let correctAnswers = 0;

let answered = false;


/* ==================================================
   HIỂN THỊ CÂU HỎI
================================================== */

function loadQuestion(){

    answered = false;

    const q = questions[currentQuestion];


    document.getElementById("questionNumber").innerHTML =
        "Câu " + (currentQuestion + 1) + "/20";


    document.getElementById("score").innerHTML =
        "Điểm: " + calculateScore();


    document.getElementById("progress").style.width =
        ((currentQuestion) / questions.length * 100) + "%";


    document.getElementById("question").innerHTML =
        q.q;


    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";


    document.getElementById("message").innerHTML = "";

    document.getElementById("message").className =
        "message";


    document.getElementById("nextButton").style.display =
        "none";


    q.o.forEach(function(optionText,index){

        const option =
            document.createElement("div");

        option.className = "option";

        option.innerHTML =
            "<b>" +
            String.fromCharCode(65 + index) +
            ".</b> " +
            optionText;


        option.onclick = function(){

            checkAnswer(option,index);

        };


        optionsContainer.appendChild(option);

    });

}


/* ==================================================
   KIỂM TRA ĐÁP ÁN
================================================== */

function checkAnswer(selected,index){

    if(answered){
        return;
    }

    answered = true;


    const correct =
        questions[currentQuestion].a;


    const allOptions =
        document.querySelectorAll(".option");


    /* Đánh dấu đáp án đúng */

    allOptions[correct].classList.add("correct");


    if(index === correct){

        correctAnswers++;

        selected.classList.add("correct");


        document.getElementById("message").innerHTML =
            "🎉 CHÚC MỪNG! EM TRẢ LỜI CHÍNH XÁC!";


        document.getElementById("message").classList.add(
            "correct-message"
        );


        createConfetti(35);


    }else{

        selected.classList.add("wrong");


        document.getElementById("message").innerHTML =
            "😢 RẤT TIẾC! HÃY GHI NHỚ ĐÁP ÁN ĐÚNG NHÉ!";


        document.getElementById("message").classList.add(
            "wrong-message"
        );

    }


    document.getElementById("score").innerHTML =
        "Điểm: " + calculateScore();


    document.getElementById("nextButton").style.display =
        "block";

}


/* ==================================================
   TÍNH ĐIỂM /10
================================================== */

function calculateScore(){

    return (
        correctAnswers /
        questions.length *
        10
    ).toFixed(1);

}


/* ==================================================
   CÂU TIẾP THEO
================================================== */

function nextQuestion(){

    currentQuestion++;


    if(currentQuestion < questions.length){

        loadQuestion();

    }else{

        finishGame();

    }

}


/* ==================================================
   KẾT THÚC TRÒ CHƠI
================================================== */

function finishGame(){

    document.getElementById("quiz").style.display =
        "none";


    document.getElementById("result").style.display =
        "block";


    document.getElementById("progress").style.width =
        "100%";


    const finalScore =
        calculateScore();


    document.getElementById("finalScore").innerHTML =
        finalScore;


    let rank = "";

    let stars = "";

    let comment = "";


    if(finalScore >= 9){

        rank =
            "👑 THÁM TỬ KIM CƯƠNG";

        stars =
            "⭐⭐⭐⭐⭐";

        comment =
            "Xuất sắc! Em đã phá án danh từ cực kỳ thành công! Em nắm rất chắc kiến thức về danh từ.";

        createConfetti(180);

    }

    else if(finalScore >= 8){

        rank =
            "🥇 THÁM TỬ VÀNG";

        stars =
            "⭐⭐⭐⭐";

        comment =
            "Rất giỏi! Em đã nhận biết được hầu hết các danh từ. Hãy tiếp tục phát huy nhé!";

        createConfetti(120);

    }

    else if(finalScore >= 6.5){

        rank =
            "🥈 THÁM TỬ BẠC";

        stars =
            "⭐⭐⭐";

        comment =
            "Khá tốt! Em đã có nền tảng tốt. Hãy luyện tập thêm để trở thành Thám tử Vàng!";

        createConfetti(80);

    }

    else if(finalScore >= 5){

        rank =
            "🥉 THÁM TỬ ĐỒNG";

        stars =
            "⭐⭐";

        comment =
            "Em đã hoàn thành nhiệm vụ! Hãy đọc lại phần ghi nhớ và thử lại nhé!";

    }

    else{

        rank =
            "🔎 THÁM TỬ TẬP SỰ";

        stars =
            "⭐";

        comment =
            "Không sao! Thám tử giỏi luôn biết cố gắng. Hãy xem lại bài Danh từ rồi chơi lại nhé!";

    }


    document.getElementById("rank").innerHTML =
        rank;


    document.getElementById("stars").innerHTML =
        stars;


    document.getElementById("comment").innerHTML =
        comment;

}


/* ==================================================
   CHƠI LẠI
================================================== */

function restartGame(){

    currentQuestion = 0;

    correctAnswers = 0;

    answered = false;


    document.getElementById("result").style.display =
        "none";


    document.getElementById("quiz").style.display =
        "block";


    loadQuestion();

}


/* ==================================================
   HIỆU ỨNG PHÁO HOA
================================================== */

function createConfetti(number){

    const container =
        document.getElementById("confetti");


    for(let i = 0; i < number; i++){

        const piece =
            document.createElement("div");


        piece.className =
            "confetti";


        piece.style.left =
            Math.random() * 100 + "vw";


        piece.style.backgroundColor =
            "hsl(" +
            Math.random() * 360 +
            ", 90%, 55%)";


        piece.style.width =
            (7 + Math.random() * 8) + "px";


        piece.style.height =
            (10 + Math.random() * 10) + "px";


        piece.style.animationDuration =
            (2 + Math.random() * 3) + "s";


        piece.style.animationDelay =
            Math.random() * 0.5 + "s";


        container.appendChild(piece);


        setTimeout(function(){

            piece.remove();

        },5000);

    }

}


/* ==================================================
   BẮT ĐẦU TRÒ CHƠI
================================================== */

loadQuestion();

</script>

</body>
</html>
